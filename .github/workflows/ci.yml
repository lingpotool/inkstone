name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧构建——省资源，也让"最新一次是否绿"没有歧义。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"          # 中文源码/输出在 Windows runner 上不乱码
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- 静态检查
  lint:
    name: lint · ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"
      - name: ruff format --check
        run: python -m ruff format --check src tests examples
      - name: ruff check
        run: python -m ruff check src tests examples
      # 类型检查跑**三个平台**：mypy 会按 host 平台收窄 `sys.platform`，
      # 并用对应平台的 typeshed（比如 `ctypes.WinDLL` 只在 Windows 上有定义）。
      # 只在本机跑，Windows 专有代码在 Linux CI 上就会红成一片——
      # 这个坑已经踩过一次，从此每次 lint 都三平台过一遍（mypy 很快）。
      - name: mypy（strict）
        run: python -m mypy
      - name: mypy · 按 Windows 平台
        run: python -m mypy --platform win32
      - name: mypy · 按 macOS 平台
        run: python -m mypy --platform darwin

  # ---------------------------------------------------------------- 三平台测试
  # 黄金图是**逐字节**比对的，理论上三平台应完全一致：
  # 无头度量表是纯数据、软件光栅是纯算术、PNG 编码固定参数，
  # 全程不依赖系统字体/时钟/随机数。若这里出现平台间不一致，
  # 说明确定性的某条链路破了——那正是要立刻知道的事。
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # 一个平台挂了也要看另外两个的结果
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
          # 最低支持版本也要真跑一遍，否则 pyproject 里的 >=3.10 是空头承诺
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"

      # 在 Linux 上跑无头测试不需要 X11：全部测试都不开窗口。
      # 这一条本身就是"布局与文本 100% 可无头测试"的证明。
      #
      # 排除 slow：性能断言是**墙上时钟**，在共享 runner 上天生会抖。
      # 让它挂在正确性任务上，只会产生"偶尔红一次"的假信号。
      # 性能由独立的 perf 任务把关（带足够的噪声余量）。
      - name: 运行全部测试（含黄金图逐字节比对）
        run: python -m pytest tests -q -m "not slow"

      - name: 黄金图不匹配时上传实际产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/golden/failures/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------- 覆盖率
  coverage:
    name: coverage · ≥85%
    # **在 Windows 上测覆盖率**，因为平台独占代码只能在自己的平台上跑。
    # `backend/gdi_fonts.py` 是 Windows 专有的真字体引擎，在 Linux 上
    # 只能跳过（`gdi_font_engine()` 直接返回 None），于是那 800 行
    # 全被算成"未覆盖"，覆盖率从 89% 掉到 83%。
    #
    # 与其把它们 omit 掉（那等于对自己最核心的一组代码闭眼），
    # 不如在能跑它们的平台上测。将来有了 macOS/Linux 字体引擎，
    # 同样的道理——**哪个平台的代码，就在哪个平台量**。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"
      # 排除 slow：性能断言的预算在覆盖率插桩下必然失真，
      # 把它和覆盖率混在一起会得到一个"时红时绿"的假信号。
      # 性能由 perf 任务在无插桩环境下单独把关。
      - name: 覆盖率（ROADMAP Phase 1 要求 ≥ 85%）
        # 写成一行：Windows runner 默认用 pwsh，行连接符与 bash 不同，
        # 少一层 shell 细节就少一个会烂的地方。
        run: python -m pytest tests -q -m "not slow" --cov=src/inkstone --cov-report=term-missing --cov-fail-under=85

  # ---------------------------------------------------------------- 性能
  # 无插桩，才能真正测出布局与排版的耗时。
  # 预算用文档里写的那个数（docs/05 §8：1000 节点 < 5ms），
  # 不额外收紧——共享 runner 的噪声会让紧阈值变成"偶尔红一次"的假信号。
  perf:
    name: perf · 布局与排版预算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"
      - name: 性能预算（1000 节点布局 / 1000 字排版）
        run: python -m pytest tests -q -m "slow" -s

  # ---------------------------------------------------------------- 架构约束
  # 单独成任务，是为了让"分层被破坏"在 CI 上有一个**指名道姓**的红点，
  # 而不是淹没在 500 多个测试里。规则写在 tests/unit/test_architecture.py。
  architecture:
    name: architecture · 分层与铁律
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"
      - name: 单向依赖 / text 层无平台 API / 组件零硬编码
        run: python -m pytest tests/unit/test_architecture.py -q
