[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inkstone"
dynamic = ["version"]
description = "专业的跨平台 Python 原生 UI 系统：纯 Python 编写，自绘渲染，Windows / macOS / Linux 一等公民"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gui", "ui", "desktop", "cross-platform", "widget", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
# 文本栈自带整形与光栅化（R4 的决策，见 docs/18 §2）：
#   uharfbuzz —— 整形（kerning / 连字 / 复杂脚本）
#   freetype-py —— 字形光栅化（灰度掩码）
#   fonttools —— 读 name/OS/2 表建字体索引、子集化内嵌字体
# 三者都有三平台预编译轮子、无编译链，与"纯 pip、无构建步骤"的承诺相容。
dependencies = [
    "uharfbuzz>=0.56",
    "freetype-py>=2.5",
    "fonttools>=4.65",
]

[project.optional-dependencies]
# 平台窗口与 GPU 渲染能力按需安装。核心包自带文本栈（上面三个依赖 +
# 内嵌字体约 1.8MB，安装合计约 24MB，仍低于 docs/00 的 <40MB 目标）。
# 注意：SDL2 后端走 ctypes 直调动态库（见 backend/sdl2.py 的报错指引），
# 不需要 PySDL2；这里只留真正要装的渲染后端。
skia = ["skia-python>=132.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/lingpotool/inkstone"
Documentation = "https://github.com/lingpotool/inkstone/tree/main/docs"
Roadmap = "https://github.com/lingpotool/inkstone/blob/main/ROADMAP.md"
Issues = "https://github.com/lingpotool/inkstone/issues"

[project.scripts]
inkstone = "inkstone.cli:main"

[tool.hatch.version]
path = "src/inkstone/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkstone"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/tests", "/examples", "/README.md", "/LICENSE", "/ROADMAP.md"]
exclude = ["/prototype"]

# ---------------- 代码质量 ----------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # 行长由 formatter 与人工判断共同负责，不做机械限制
    # 本项目是"中文一等公民"：注释、文档串、错误提示里大量使用中文标点
    # （，。（）「」）。RUF001/002/003 会把它们当成"易混淆的 Unicode 字符"，
    # 对中文项目属于误报，故整体关闭。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["skia.*", "freetype.*", "uharfbuzz.*", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` 本身入 path：黄金图比对助手（tests/png_compare.py）要被两个测试模块共用，
# 而测试目录不是 Python 包（没有 __init__.py），只能靠这一行让它可导入。
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: 黄金图（截图）对比测试，需要光栅后端",
    "platform: 需要真实窗口/输入的平台相关测试",
    "slow: 耗时较长的测试",
]

[tool.coverage.run]
source = ["src/inkstone"]
branch = true
